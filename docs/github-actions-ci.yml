name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf tesseract-ocr tesseract-ocr-eng ffmpeg
      - run: dotnet test --configuration Release
